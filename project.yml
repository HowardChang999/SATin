name: SATin
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: 14.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.howard.SATin
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CODE_SIGN_STYLE: Automatic
packages: {}
targets:
  SATin:
    type: application
    platform: macOS
    sources:
      - path: Sources/SATin
    resources:
      - path: Sources/SATin/Resources
    settings:
      base:
        PRODUCT_NAME: SATin
        INFOPLIST_KEY_CFBundleDisplayName: SATin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 SATin
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - SATinTests
  SATinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SATinTests
    dependencies:
      - target: SATin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
