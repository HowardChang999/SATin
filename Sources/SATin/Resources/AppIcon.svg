<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Top half: white background, dark blue "SAT" -->
    <rect x="0" y="0" width="1024" height="512" fill="#ffffff"/>
    <!-- Bottom half: dark blue background, white "in" -->
    <rect x="0" y="512" width="1024" height="512" fill="#1a3a6b"/>

    <!-- "SAT" text on white background -->
    <text x="512" y="360" font-family="Helvetica, Arial, sans-serif" font-size="340" font-weight="900" fill="#1a3a6b" text-anchor="middle" letter-spacing="-4">SAT</text>

    <!-- "in" text on dark blue background -->
    <text x="512" y="730" font-family="Helvetica, Arial, sans-serif" font-size="280" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="6">in</text>
  </g>
</svg>
